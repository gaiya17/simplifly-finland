version: '3.8'

services:
  caddy:
    image: caddy:2
    restart: always
    ports:
      # Only Caddy faces the internet. Frontend and backend are NOT exposed.
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC) support
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro   # read-only mount
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      - frontend
      - backend

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    restart: always
    # No `ports:` — backend is intentionally NOT reachable from outside Docker.
    # Only Caddy (on the same internal network) can reach it.
    volumes:
      # Named volume for uploaded PDFs — persists across container rebuilds.
      # Without this, every `docker compose up --build` deletes all uploaded files.
      - uploads:/app/uploads
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the JS bundle at build time.
        # /api means browser calls go through the Next.js rewrite proxy.
        NEXT_PUBLIC_API_URL: /api
    environment:
      # Server-side (SSR/RSC) calls go directly to the backend container.
      # This avoids an unnecessary round-trip through Caddy.
      - INTERNAL_API_URL=http://backend:5000/api
      - NODE_ENV=production
    restart: always
    # No `ports:` — frontend is intentionally NOT reachable from outside Docker.
    # Only Caddy (on the same internal network) can reach it.
    networks:
      - web
    depends_on:
      backend:
        condition: service_healthy

networks:
  web:
    # Custom bridge network — containers communicate by service name (e.g. "backend")
    # and are isolated from all other Docker networks on the host.
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  uploads:   # Persistent storage for uploaded PDFs
